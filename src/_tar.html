<!doctype html>
<meta charset="utf-8">

<script async type="module">
    /**
     * @param {File[]} files
     * @return {Promise<Uint8Array<ArrayBuffer>>}
     */
    async function entar(files) {
        const BLOCK_SIZE = 512;

        const encoder = new TextEncoder();
        const tar = new Uint8Array(files.reduce((v, {size}) => v + BLOCK_SIZE * (Math.ceil(size / BLOCK_SIZE) + 1), 0) + BLOCK_SIZE * 2);

        for (let i = 0, j = 0; i < tar.byteLength - BLOCK_SIZE * 2; j++) {
            const file = files[j];

            tar.set(encoder.encode(file.name).subarray(0, 100), i);
            tar.set(encoder.encode("0000777"), i + 100);
            tar.set(encoder.encode("0000000"), i + 108);
            tar.set(encoder.encode("0000000"), i + 116);
            tar.set(encoder.encode(file.size.toString(8).padStart(11, "0")).subarray(0, 11), i + 124);
            tar.set(encoder.encode(file.lastModified.toString(8).padStart(11, "0")).subarray(0, 11), i + 136);
            tar.set(encoder.encode("        "), i + 148);
            tar.set(encoder.encode("0"), i + 156);
            tar.set(encoder.encode("ustar"), i + 257);
            tar.set(encoder.encode("00"), i + 263);
            tar.set(await file.bytes(), i + BLOCK_SIZE);

            tar.set(encoder.encode(tar.subarray(i, i + BLOCK_SIZE).reduce((v, n) => v + n, 0).toString(8).padStart(6, "0").concat("\0")).subarray(0, 7), i + 148);

            i += BLOCK_SIZE * (Math.ceil(file.size / BLOCK_SIZE) + 1);
        }

        return tar;
    }

    /**
     * @param {Uint8Array<ArrayBuffer>} tar
     * @return {NonNullable<FileTar>[]}
     */
    function untar(tar) {
        const BLOCK_SIZE = 512;

        const decoder = new TextDecoder();

        /** @type {Uint8Array<ArrayBuffer>[]} */
        const bufs = [];
        let offset = 0;

        while (offset < tar.byteLength - BLOCK_SIZE * 2) {
            const size = parseInt(decoder.decode(tar.subarray(offset + 124, offset + 135)), 8);

            bufs.push(tar.slice(offset, offset += BLOCK_SIZE + size + (BLOCK_SIZE - size % BLOCK_SIZE)));
        }

        return bufs.map((buf) => {
            const name = decoder.decode(buf.subarray(0, 99)).replaceAll("\0", "");
            const mode = parseInt(decoder.decode(buf.subarray(100, 107)), 8);
            const uid = parseInt(decoder.decode(buf.subarray(108, 115)), 8);
            const gid = parseInt(decoder.decode(buf.subarray(116, 123)), 8);
            const size = parseInt(decoder.decode(buf.subarray(124, 135)), 8);
            const timestamp = parseInt(decoder.decode(buf.subarray(136, 147)), 8);
            const checksum = parseInt(decoder.decode(buf.subarray(148, 154)), 8);
            const type = decoder.decode(buf.subarray(156, 157));
            const magic = decoder.decode(buf.subarray(257, 262));
            const body = buf.slice(BLOCK_SIZE, BLOCK_SIZE + size);

            if (magic !== "ustar") {
                throw new Error("Invalid tar magic.");
            } else if (checksum !== buf.subarray(0, BLOCK_SIZE).reduce((v, n, i) => 147 < i && i < 156 ? v + 0x20 : v + n, 0)) {
                throw new Error("Invalid tar checksum.");
            }

            /** @type {FileTar} */
            const file = {
                name: name,
                body: body,
                timestamp: timestamp,
                mode: mode,
                uid: uid,
                gid: gid,
                type: type
            };

            return file;
        });
    }

    /**
     * @param {number} size
     * @return {Uint8Array<ArrayBuffer>}
     */
    function _dummy(size) {
        return new Uint8Array(new Float32Array(size / 4).map(() => Math.random()).buffer);
    }

    /** @type {FileTar[]} */
    const samples = [{
        name: "foo",
        body: _dummy(1024 ** 2)
    }, {
        name: "bar",
        body: _dummy(1024 ** 2)
    }];

    const encode = entar(samples);
    const decode = untar(encode);

    console.log(encode);
    console.log(decode);
</script>
