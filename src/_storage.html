<!doctype html>
<meta charset="utf-8">

<script async type="module">
    /**
     * @template {Record<string, unknown> | unknown[]} T
     * @param {Storage} storage
     * @param {string} key
     * @param {T} initialValue
     * @return {T}
     */
    function createStorage(storage, key, initialValue) {
        /**
         * @template {unknown} U
         * @param {U} value
         * @return {U}
         */
        function createProxy(value) {
            if (typeof value !== "object" || value === null) {
                return value;
            }

            return new Proxy(value, {
                get(target, property) {
                    const effect = Reflect.get(target, property);

                    return createProxy(effect);
                },
                set(target, property, newValue) {
                    const effect = Reflect.set(target, property, newValue);

                    if (effect) {
                        storage.setItem(key, JSON.stringify(context));
                    }

                    return effect;
                },
                deleteProperty(target, property) {
                    const effect = Reflect.deleteProperty(target, property);

                    if (effect) {
                        storage.setItem(key, JSON.stringify(context));
                    }

                    return effect;
                }
            });
        }

        const json = storage.getItem(key);

        if (!json) {
            storage.setItem(key, JSON.stringify(initialValue));
        }

        const context = json ? JSON.parse(json) : structuredClone(initialValue);

        return createProxy(context);
    }

    const foo = createStorage(sessionStorage, "foo", {
        value: 123
    });

    console.log(foo.value);

    foo.value = 321;

    console.log(foo.value);

    sessionStorage.clear();
</script>
