<!doctype html>
<meta charset="utf-8">

<script async type="module">
    /**
     * @template {string | number | boolean | null} T
     * @param {Storage} storage
     * @param {string} key
     * @param {T} initialValue
     * @return {{value: T extends string ? string : T extends number ? number : T extends boolean ? boolean : T extends null ? null : never; remove(): void;}}
     */
    function createStorage(storage, key, initialValue) {
        return {
            get value() {
                const currentValue = storage.getItem(key);

                return currentValue === null ? initialValue : JSON.parse(currentValue);
            },
            set value(newValue) {
                storage.setItem(key, JSON.stringify(newValue));
            },
            remove() {
                storage.removeItem(key);
            }
        };
    }

    /**
     * @template {Record<string, unknown> | unknown[]} T
     * @param {Storage} storage
     * @param {string} key
     * @param {T} initialValue
     * @return {T}
     */
    function createStorage(storage, key, initialValue) {
        /**
         * @template {unknown} U
         * @param {U} value
         * @return {U}
         */
        function createProxy(value) {
            if (typeof value !== "object" || value === null) {
                return value;
            }

            return new Proxy(value, {
                get(target, property) {
                    const effect = Reflect.get(target, property);

                    return createProxy(effect);
                },
                set(target, property, newValue) {
                    const effect = Reflect.set(target, property, newValue);

                    if (effect) {
                        storage.setItem(key, JSON.stringify(context));
                    }

                    return effect;
                },
                deleteProperty(target, property) {
                    const effect = Reflect.deleteProperty(target, property);

                    if (effect) {
                        storage.setItem(key, JSON.stringify(context));
                    }

                    return effect;
                }
            });
        }

        const json = storage.getItem(key);

        if (!json) {
            storage.setItem(key, JSON.stringify(initialValue));
        }

        const context = json ? JSON.parse(json) : structuredClone(initialValue);

        return createProxy(context);
    }

    const foo = createStorage(sessionStorage, "foo", 123);

    console.log(foo.value);

    foo.value = 321;

    console.log(foo.value);

    foo.remove();
</script>
