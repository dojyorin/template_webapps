<!doctype html>
<meta charset="utf-8">

<script async type="module">
    /**
     * @template {string | number | boolean | null} T
     * @param {Storage} storage
     * @param {string} key
     * @param {T} initialValue
     * @return {{value: T extends string ? string : T extends number ? number : T extends boolean ? boolean : T extends null ? null : never; remove(): void;}}
     */
    function createStorage(storage, key, initialValue) {
        return {
            get value() {
                const currentValue = storage.getItem(key);

                return currentValue === null ? initialValue : JSON.parse(currentValue);
            },
            set value(newValue) {
                storage.setItem(key, JSON.stringify(newValue));
            },
            remove() {
                storage.removeItem(key);
            }
        };
    }

    /**
     * @template {Record<string, unknown> | unknown[]} T
     * @param {Storage} storage
     * @param {string} key
     * @param {T} initialValue
     * @return {T}
     */
    function createStorage(storage, key, initialValue) {
        /**
         * @template {unknown} U
         * @param {U} data
         * @return {U}
         */
        function createProxy(data) {
            if (typeof data !== "object" || data === null) {
                return data;
            }

            return new Proxy(data, {
                get(t, p) {
                    const a = Reflect.get(t, p);

                    return createProxy(a);
                },
                set(t, p, v) {
                    const a = Reflect.set(t, p, v);

                    if (a) {
                        setValue(body);
                    }

                    return a;
                },
                deleteProperty(t, p) {
                    const a = Reflect.deleteProperty(t, p);

                    if (a) {
                        setValue(body);
                    }

                    return a;
                }
            });
        }

        /**
         * @return {T | null}
         */
        function getValue() {
            return JSON.parse(storage.getItem(key) ?? "null");
        }

        /**
         * @param {T | null} data
         * @return {void}
         */
        function setValue(data) {
            storage.setItem(key, JSON.stringify(data));
        }

        const maybeBody = getValue();
        const body = structuredClone(maybeBody ?? initialValue);

        if (!maybeBody) {
            setValue(body);
        }

        return createProxy(body);
    }

    const foo = createStorage(sessionStorage, "foo", 123);

    console.log(foo.value);

    foo.value = 321;

    console.log(foo.value);

    foo.remove();
</script>
