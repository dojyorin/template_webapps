<!doctype html>
<meta charset="utf-8">

<script async type="module">
    /**
     * @template {Record<string, unknown> | unknown[]} T
     * @param {Storage} storage
     * @param {string} key
     * @param {T} initialValue
     * @return {T}
     */
    function createStorage(storage, key, initialValue) {
        const json = storage.getItem(key);

        if (json === null) {
            storage.setItem(key, JSON.stringify(initialValue));
        }

        /** @type {T} */
        const value = JSON.parse(json ?? JSON.stringify(initialValue));

        return (/** @type {<U extends unknown>(rawValue: U) => U} */function recurse(rawValue) {
            if (typeof rawValue !== "object" || rawValue === null) {
                return rawValue;
            }

            for (const property of Reflect.ownKeys(rawValue)) {
                const descriptor = Reflect.getOwnPropertyDescriptor(rawValue, property);

                if (descriptor?.writable) {
                    Reflect.set(rawValue, property, recurse(descriptor.value));
                }
            }

            return new Proxy(rawValue, {
                set(target, property, newValue, receiver) {
                    const effect = Reflect.set(target, property, recurse(newValue), receiver);

                    if (effect) {
                        storage.setItem(key, JSON.stringify(value));
                    }

                    return effect;
                },
                deleteProperty(target, property) {
                    const effect = Reflect.deleteProperty(target, property);

                    if (effect) {
                        storage.setItem(key, JSON.stringify(value));
                    }

                    return effect;
                }
            });
        })(value);
    }

    const foo = createStorage(sessionStorage, "foo", {
        value: 123
    });

    console.log(foo.value);

    foo.value = 321;

    console.log(foo.value);

    sessionStorage.clear();
</script>
