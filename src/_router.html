<!doctype html>
<meta charset="utf-8">

<script type="module">
    /**
     * @param {{path: string; method: string; handler(request: Request, param?: Record<string, string | undefined>): Response | Promise<Response>;}[]} routes
     * @return {{fetch(request: Request): Promise<Response>;}}
     */
    function createRouter(...routes) {
        return {
            async fetch(request) {
                const routesFound = routes.filter(({path}) => new URLPattern({pathname: path}).test(request.url));

                if (!routesFound.length) {
                    return new Response(undefined, {
                        status: 404
                    });
                }

                const route = routesFound.find(({method}) => method === request.method);

                if (!route) {
                    return new Response(undefined, {
                        status: 405
                    });
                }

                return await route.handler(request, new URLPattern({pathname: route.path}).exec(request.url)?.pathname.groups);
            }
        };
    }

    const router = createRouter({
        path: "/",
        method: "GET",
        handler() {
            return new Response(/*html*/`
                <h1>Hello!</h1>
            `, {
                headers: {
                    "Content-Type": "text/html"
                }
            });
        }
    });

    console.log(await router.fetch(new Request(location.origin)));
</script>
