<!doctype html>
<meta charset="utf-8">

<script type="module">
    /** @type {{path: string; method: string; handler(request: Request, param?: Record<string, string | undefined>): Response | Promise<Response>;}[]} */
    const routes = [{
        path: "/",
        method: "GET",
        handler() {
            return new Response(/*html*/`
                <h1>Hello!</h1>
            `, {
                headers: {
                    "Content-Type": "text/html"
                }
            });
        }
    }];

    const response = await (async (request) => {
        const routesFound = routes.filter(({path}) => new URLPattern({pathname: path}).test(request.url));

        if (!routesFound.length) {
            return new Response(undefined, {
                status: 404
            });
        }

        const route = routesFound.find(({method}) => method === request.method);

        if (!route) {
            return new Response(undefined, {
                status: 405
            });
        }

        return await route.handler(request, new URLPattern({pathname: route.path}).exec(request.url)?.pathname.groups);
    })(new Request(location.origin));

    console.log(response);
</script>
