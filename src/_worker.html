<!doctype html>
<meta charset="utf-8">

<script async type="module">
    /**
     * @template {unknown} T
     * @template {unknown} U
     * @param {string | URL} url
     * @param {number} [parallel]
     * @return {{open(): void; close(): void; submit(message: T, transfers?: Transferable[]): Promise<U>;}}
     */
    function createWorkerPool(url, parallel) {
        /** @type {WeakSet<Worker>} */
        const busy = new WeakSet();
        /** @type {Worker[]} */
        const workers = [];
        /** @type {{message: T; transfers?: Transferable[]; resolve(value: U): void; reject(reason?: unknown): void;}[]} */
        const jobs = [];

        return {
            open() {
                if (workers.length) {
                    throw new Error();
                }

                for (let i = 0; i < (parallel ?? 1); i++) {
                    const worker = new Worker(url, {
                        type: "module"
                    });

                    workers.push(worker);
                }
            },
            close() {
                for (const worker of workers) {
                    worker.terminate();
                }

                for (const job of jobs) {
                    job.reject();
                }

                workers.splice(0);
                jobs.splice(0);
            },
            async submit(message, transfers) {
                if (!workers.length) {
                    throw new Error();
                }

                return await new Promise((resolve, reject) => {
                    const worker = workers.find((v) => !busy.has(v));

                    if (worker) {
                        (/** @type {(worker: Worker, job: typeof jobs[number]) => void} */function recurse(worker, job) {
                            function release() {
                                worker.onmessage = null;
                                worker.onerror = null;

                                busy.delete(worker);

                                const next = jobs.shift();

                                if (next) {
                                    recurse(worker, next);
                                }
                            }

                            busy.add(worker);

                            worker.onmessage = ({data}) => {
                                release();
                                job.resolve(data);
                            };

                            worker.onerror = (event) => {
                                release();
                                job.reject(event);
                            };

                            worker.postMessage(job.message, {
                                transfer: job.transfers
                            });
                        })(worker, {message, transfers, resolve, reject});
                    } else {
                        jobs.push({message, transfers, resolve, reject});
                    }
                });
            }
        };
    }

    /**
     * @param {number} size
     * @return {Uint8Array<ArrayBuffer>}
     */
    function _dummy(size) {
        return new Uint8Array(new Float32Array(size / 4).map(() => Math.random()).buffer);
    }

    const js = /*js*/`
        ${_dummy}

        globalThis.onmessage = ({data}) => {
            const binary = _dummy(data);

            globalThis.postMessage(binary, {
                transfer: [binary.buffer]
            });
        };
    `;

    /** @type {ReturnType<typeof createWorkerPool<number, Uint8Array<ArrayBuffer>>>} */
    const wp = createWorkerPool(`data:text/javascript;base64,${new TextEncoder().encode(js).toBase64()}`, navigator.hardwareConcurrency);

    wp.open();

    const outputs = await Promise.all(Array.from({length: navigator.hardwareConcurrency * 2}, () => wp.submit(1024 ** 2)));

    console.log(outputs);

    wp.close();
</script>
