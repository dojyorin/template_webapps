<!doctype html>
<meta charset="utf-8">

<script async type="module">
    /**
     * @param {Uint8Array<ArrayBuffer>} data
     * @return {Promise<Uint8Array<ArrayBuffer>>}
     */
    async function digest(data) {
        return new Uint8Array(await crypto.subtle.digest("SHA-256", data));
    }

    /**
     * @return {Promise<Record<keyof CryptoKeyPair, Uint8Array<ArrayBuffer>>>}
     */
    async function generateKeyX25519() {
        /** @satisfies {CryptoKeyPair} */
        const {publicKey, privateKey} = await crypto.subtle.generateKey("X25519", true, ["deriveKey"]);

        return {
            publicKey: new Uint8Array(await crypto.subtle.exportKey("spki", publicKey)),
            privateKey: new Uint8Array(await crypto.subtle.exportKey("pkcs8", privateKey))
        };
    }

    /**
     * @return {Promise<Record<keyof CryptoKeyPair, Uint8Array<ArrayBuffer>>>}
     */
    async function generateKeyEd25519() {
        /** @satisfies {CryptoKeyPair} */
        const {publicKey, privateKey} = await crypto.subtle.generateKey("Ed25519", true, ["sign"]);

        return {
            publicKey: new Uint8Array(await crypto.subtle.exportKey("spki", publicKey)),
            privateKey: new Uint8Array(await crypto.subtle.exportKey("pkcs8", privateKey))
        };
    }

    /**
     * @param {string} password
     * @param {Uint8Array<ArrayBuffer>} salt
     * @return {Promise<Uint8Array<ArrayBuffer>>}
     */
    async function deriveKeyPassword(password, salt) {
        const key = await crypto.subtle.deriveKey({
            name: "Argon2id",
            memory: 65536,
            passes: 1,
            parallelism: 4,
            nonce: salt
        }, await crypto.subtle.importKey("raw-secret", new TextEncoder().encode(password), "Argon2id", false, ["deriveKey"]), "ChaCha20-Poly1305", true, ["encrypt", "decrypt"]);

        return new Uint8Array(await crypto.subtle.exportKey("raw-secret", key));
    }

    /**
     * @param {Uint8Array<ArrayBuffer>} privateKey
     * @param {Uint8Array<ArrayBuffer>} publicKey
     * @return {Promise<Uint8Array<ArrayBuffer>>}
     */
    async function deriveKeyX25519(privateKey, publicKey) {
        const key = await crypto.subtle.deriveKey({
            name: "X25519",
            public: await crypto.subtle.importKey("spki", publicKey, "X25519", false, [])
        }, await crypto.subtle.importKey("pkcs8", privateKey, "X25519", false, ["deriveKey"]), "ChaCha20-Poly1305", true, ["encrypt", "decrypt"]);

        return new Uint8Array(await crypto.subtle.exportKey("raw-secret", key));
    }

    /**
     * @param {Uint8Array<ArrayBuffer>} key
     * @param {Uint8Array<ArrayBuffer>} data
     * @return {Promise<Uint8Array<ArrayBuffer>>}
     */
    async function encrypt(key, data) {
        const nonce = crypto.getRandomValues(new Uint8Array(12));

        const body = await crypto.subtle.encrypt({
            name: "ChaCha20-Poly1305",
            iv: nonce
        }, await crypto.subtle.importKey("raw-secret", key, "ChaCha20-Poly1305", false, ["encrypt"]), data);

        const output = new Uint8Array(nonce.byteLength + body.byteLength);
        output.set(nonce, 0);
        output.set(new Uint8Array(body), nonce.byteLength);

        return output;
    }

    /**
     * @param {Uint8Array<ArrayBuffer>} key
     * @param {Uint8Array<ArrayBuffer>} data
     * @return {Promise<Uint8Array<ArrayBuffer>>}
     */
    async function decrypt(key, data) {
        const nonce = data.subarray(0, 12);

        const body = await crypto.subtle.decrypt({
            name: "ChaCha20-Poly1305",
            iv: nonce
        }, await crypto.subtle.importKey("raw-secret", key, "ChaCha20-Poly1305", false, ["decrypt"]), data.subarray(nonce.byteLength));

        return new Uint8Array(body);
    }

    /**
     * @param {Uint8Array<ArrayBuffer>} privateKey
     * @param {Uint8Array<ArrayBuffer>} data
     * @return {Promise<Uint8Array<ArrayBuffer>>}
     */
    async function sign(privateKey, data) {
        return new Uint8Array(await crypto.subtle.sign("Ed25519", await crypto.subtle.importKey("pkcs8", privateKey, "Ed25519", false, ["sign"]), data));
    }

    /**
     * @param {Uint8Array<ArrayBuffer>} publicKey
     * @param {Uint8Array<ArrayBuffer>} sign
     * @param {Uint8Array<ArrayBuffer>} data
     * @return {Promise<boolean>}
     */
    async function verify(publicKey, sign, data) {
        return await crypto.subtle.verify("Ed25519", await crypto.subtle.importKey("spki", publicKey, "Ed25519", false, ["verify"]), sign, data);
    }

    /**
     * @param {Uppercase<string>} label
     * @param {Uint8Array<ArrayBuffer>} data
     * @return {string}
     */
    function encodePEM(label, data) {
        return `-----BEGIN ${label}-----\n${data.toBase64().split(/(?<=^(?:.{64})+)/)}\n-----END ${label}-----`;
    }

    /**
     * @param {string} data
     * @return {Uint8Array<ArrayBuffer>}
     */
    function decodePEM(data) {
        return Uint8Array.fromBase64(data.trim().replaceAll("\r", "").split("\n").slice(1, -1).join(""));
    }

    /**
     * @param {number} size
     * @return {Uint8Array<ArrayBuffer>}
     */
    function _dummy(size) {
        return new Uint8Array(new Float32Array(size / 4).map(() => Math.random()).buffer);
    }

    const binary = _dummy(1024 ** 2);
    const password = "foobar";
    const salt = _dummy(16);
    const secret = _dummy(32);

    const hash = await digest(binary);
    const encryptKeyPair = await generateKeyX25519();
    const signKeyPair = await generateKeyEd25519();
    const encryptKeyFromPassword = await deriveKeyPassword(password, salt);
    const encryptKeyFromX25519 = await deriveKeyX25519(encryptKeyPair.privateKey, encryptKeyPair.publicKey);
    const cipherWithPassword = await encrypt(encryptKeyFromPassword, binary);
    const cipherWithSecret = await encrypt(secret, binary);
    const cipherWithX25519 = await encrypt(encryptKeyFromX25519, binary);
    const plainWithPassword = await decrypt(encryptKeyFromPassword, cipherWithPassword);
    const plainWithSecret = await decrypt(secret, cipherWithSecret);
    const plainWithX25519 = await decrypt(encryptKeyFromX25519, cipherWithX25519);
    const signResult = await sign(signKeyPair.privateKey, binary);
    const verifyResult = await verify(signKeyPair.publicKey, signResult, binary);
    const privateKeyWithPEM = encodePEM("PRIVATE KEY", encryptKeyPair.privateKey);
    const publicKeyWithPEM = encodePEM("PUBLIC KEY", encryptKeyPair.publicKey);
    const privateKeyFromPEM = decodePEM(privateKeyWithPEM);
    const publicKeyFromPEM = decodePEM(publicKeyWithPEM);

    console.log(hash);
    console.log(encryptKeyPair);
    console.log(signKeyPair);
    console.log(encryptKeyFromPassword);
    console.log(encryptKeyFromX25519);
    console.log(cipherWithPassword);
    console.log(cipherWithSecret);
    console.log(cipherWithX25519);
    console.log(plainWithPassword);
    console.log(plainWithSecret);
    console.log(plainWithX25519);
    console.log(signResult);
    console.log(verifyResult);
    console.log(privateKeyWithPEM);
    console.log(publicKeyWithPEM);
    console.log(privateKeyFromPEM);
    console.log(publicKeyFromPEM);
</script>
