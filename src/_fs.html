<!doctype html>
<meta charset="utf-8">

<script async type="module">
    /**
     * @overload
     * @param {false} multiple
     * @param {string} [accept]
     * @return {Promise<File | null>}
     *
     * @overload
     * @param {true} multiple
     * @param {string} [accept]
     * @return {Promise<File[]>}
     *
     * @param {boolean} multiple
     * @param {string} [accept]
     * @return {Promise<File[] | File | null>}
     */
    async function upload(multiple, accept) {
        return await new Promise((resolve, reject) => {
            const input = document.createElement("input");

            input.type = "file";
            input.multiple = multiple;
            input.accept = accept ?? "";
            input.onchange = (event) => input.files ? resolve(multiple ? Array.from(input.files) : input.files.item(0)) : reject(event);
            input.oncancel = (event) => reject(event);

            input.click();
        });
    }

    /**
     * @param {string} name
     * @param {BlobPart} body
     * @return {void}
     */
    function download(name, body) {
        const a = document.createElement("a");

        a.download = name;
        a.href = URL.createObjectURL(new Blob([body]));

        a.click();
    }

    document.getElementById("upload").onclick = async () => {
        console.log(await upload(false));
    };

    document.getElementById("download").onclick = () => {
        download("test", "test123");
    };
</script>

<button type="button" id="upload">Upload</button>
<button type="button" id="download">Download</button>
