<!doctype html>
<meta charset="utf-8">

<script type="module">
    import {default as Reveal} from "https://esm.sh/reveal.js@6.0.2?target=esnext";
    import {default as RevealHighlight} from "https://esm.sh/reveal.js@6.0.2/plugin/highlight?target=esnext";
    import {default as RevealMarkdown} from "https://esm.sh/reveal.js@6.0.2/plugin/markdown?target=esnext";
    import {default as RevealNotes} from "https://esm.sh/reveal.js@6.0.2/plugin/notes?target=esnext";
    import {default as RevealMath} from "https://esm.sh/reveal.js@6.0.2/plugin/math?target=esnext";
    import {default as RevealZoom} from "https://esm.sh/reveal.js@6.0.2/plugin/zoom?target=esnext";

    /** @type {new (target: Element, option?: {plugins?: unknown[];}) => {initialize(): Promise<void>;}} */
    const _Reveal = Reveal;
    /** @type {unknown} */
    const _RevealHighlight = RevealHighlight;
    /** @type {unknown} */
    const _RevealMarkdown = RevealMarkdown;
    /** @type {unknown} */
    const _RevealNotes = RevealNotes;
    /** @type {unknown} */
    const _RevealMath = RevealMath;
    /** @type {unknown} */
    const _RevealZoom = RevealZoom;

    await new _Reveal(document.getElementsByClassName("reveal")[0], {
        plugins: [
            _RevealHighlight,
            _RevealMarkdown,
            _RevealNotes,
            _RevealMath,
            _RevealZoom
        ]
    }).initialize();
</script>

<style>
    @import "https://esm.sh/reveal.js@6.0.2/dist/reveal.css";
    @import "https://esm.sh/reveal.js@6.0.2/dist/theme/black.css";
</style>

<div class="reveal">
    <div class="slides">
        <section data-markdown>
            # Test Page 1
            - 1
            - 2
            - 3
        </section>

        <section data-markdown>
            # Test Page 2
            - 4
            - 5
            - 6
        </section>
    </div>
</div>
