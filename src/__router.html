<!doctype html>
<meta charset="utf-8">

<script async type="module">
    /**
     * @param {{path: string; method: string; handler(request: Request, param?: Record<string, string | undefined>): Response | Promise<Response>;}[]} routes
     * @return {{fetch(request: Request): Promise<Response>;}}
     */
    const routes = [{
        path: "/",
        method: "GET",
        handler() {
            return new Response(/*html*/`
                <h1>Hello!</h1>
            `, {
                headers: {
                    "Content-Type": "text/html"
                }
            });
        }
    }];

    /**
     * @type {{fetch(request: Request): Promise<Response>;}}
     */
    export default {
        async fetch(request) {
            const routesMatched = routes.filter(({path}) => new URLPattern({pathname: path}).test(request.url));

            if (!routesMatched.length) {
                return new Response(undefined, {
                    status: 404
                });
            }

            const route = routesMatched.find(({method}) => method === request.method);

            if (!route) {
                return new Response(undefined, {
                    status: 405
                });
            }

            return await route.handler(request, new URLPattern({pathname: route.path}).exec(request.url)?.pathname.groups);
        }
    };
</script>
